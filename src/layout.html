<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- the four symbols from the Alchemy MMA logo, as explained on the About page -->
  <symbol id="g-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="g-triangle" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/></symbol>
  <symbol id="g-earth" viewBox="0 0 24 24"><path d="M3 5h18L12 21z"/><path d="M6.5 11h11"/></symbol>
  <symbol id="g-air" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M6.5 13h11"/></symbol>
  <!-- two more shapes from the logo: the plain downward triangle, and the ring-and-dot under the wordmark -->
  <symbol id="g-water" viewBox="0 0 24 24"><path d="M3 5h18L12 21z"/></symbol>
  <!-- the small circle sitting on a triangle at the top of the emblem -->
  <symbol id="g-ascent" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="3"/><path d="M12 8.5v2.5"/><path d="M12 11l7 10H5z"/></symbol>
  <symbol id="g-orb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/></symbol>
</svg>
